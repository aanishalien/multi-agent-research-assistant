[project]
name = "multi-agent-research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.4",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "pytest>=9.1.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]
